name: Deploy personal homepage to Cloudflare
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-homepage
  cancel-in-progress: false
jobs:
  deploy:
    # Enable after the deployment secret has been provisioned and authorized.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare static homepage, sitemap and public assets
        run: python deployment/prepare.py
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python deployment/deploy.py

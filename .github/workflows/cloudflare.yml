name: Deploy personal homepage to Cloudflare
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-homepage
  cancel-in-progress: false
jobs:
  deploy:
    # Enable after the deployment secret has been provisioned and authorized.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: deployment/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public site
        run: bundle exec jekyll build --config _config.yml,deployment/cloudflare.yml
      - name: Prepare canonical sitemap and public assets
        run: python deployment/prepare.py
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python deployment/deploy.py
